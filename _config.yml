title: Mohammadreza Salehi
description: Blog posts on self-supervised learning, video representation learning and generative models.
author: Mohammadreza Salehi
url: https://smsd75.github.io

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax   # emits \( \) / \[ \] which KaTeX renders client-side
highlighter: rouge

permalink: /blog/:year/:month/:title/

plugins:
  - jekyll-feed
feed:
  path: blog/feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - .vscode-upload.json

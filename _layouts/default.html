<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/style.css?v=20260925c">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} blog" href="/blog/feed.xml">
    {% if page.math %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false}
        ]});"></script>
    {% endif %}
</head>
<body>
    <header>
        <h1><a href="/" class="site-title">Mohammadreza Salehi</a></h1>
        <p>PhD@University of Amsterdam, Ex-Intern@Samsung and GoogleDeepMind</p>
    </header>
    <nav>
        <ul>
            <li><a href="/#About">About</a></li>
            <li><a href="/#News">News</a></li>
            <li><a href="/#Publications">Publications</a></li>
            <li><a href="/blog/">Blog</a></li>
            <li><a href="/#Contact">Contact</a></li>
        </ul>
    </nav>
    <main>
        {{ content }}
    </main>
    <footer>
        <p>&copy; {{ site.time | date: "%Y" }} Mohammadreza Salehi</p>
    </footer>
</body>
</html>
